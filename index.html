<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶箱行情簿</title>
<style>
:root{
  --bg:#17130e; --panel:#221c15; --panel2:#2b241b; --line:#4a3d2c;
  --text:#efe4cf; --muted:#a8987c; --accent:#d9a441;
  --gold:#e8b949; --gem:#5ec8e5; --buy:#6fbf73; --sell:#e07a5f; --danger:#c85a4a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
header h1{margin:0;font-size:22px;color:var(--accent);letter-spacing:1px}
header span{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:15px;width:100%;font-family:inherit}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);color:var(--muted);border:0;padding:9px 6px;font-size:14px;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v=buy]{background:var(--buy);color:#10210f;font-weight:700}
.seg button.on[data-v=sell]{background:var(--sell);color:#2a0f08;font-weight:700}
.seg button.on[data-v=gold]{background:var(--gold);color:#2a1e05;font-weight:700}
.seg button.on[data-v=gem]{background:var(--gem);color:#06222b;font-weight:700}
.seg button.on[data-v=all]{background:var(--accent);color:#2a1e05;font-weight:700}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{background:var(--accent);color:#2a1e05;border:0;border-radius:7px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .t{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.tag.buy{background:var(--buy);color:#10210f}.tag.sell{background:var(--sell);color:#2a0f08}
.tag.gold{background:var(--gold);color:#2a1e05}.tag.gem{background:var(--gem);color:#06222b}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.kv b{font-variant-numeric:tabular-nums}
.kv .when{color:var(--muted);font-size:12px}
.hi{color:#f08c6c}.lo{color:#7fd08a}
.empty{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td .when{display:block;color:var(--muted);font-size:11px}
.tablewrap{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.log .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.log .when{color:var(--muted);font-size:12px;min-width:120px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.x:hover{color:var(--danger)}
svg text{fill:var(--muted);font-size:11px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>寶箱行情簿</h1>
  <span>Chest Market Ledger · 記錄市場寶箱買賣價格</span>
</header>

<!-- 新增紀錄 -->
<div class="card">
  <h2>新增紀錄</h2>
  <div class="grid">
    <label class="f">交易方向
      <div class="seg" id="fSide"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
    </label>
    <label class="f">寶箱種類<select id="fChest"></select></label>
    <label class="f">幣別
      <div class="seg" id="fCur"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
    </label>
    <label class="f">價格<input id="fPrice" inputmode="decimal" placeholder="例：1250000 或 1.25m"></label>
    <label class="f">日期與時間（小時）
      <div class="row"><input type="date" id="fDate"><select id="fHour"></select></div>
    </label>
  </div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap">
    <button class="btn" id="addBtn" style="flex:0 0 auto">記錄</button>
    <button class="btn ghost small" id="nowBtn" style="flex:0 0 auto">時間設為現在</button>
  </div>
  <div class="hint">價格可用 k / m / b 縮寫（例如 350k、1.2m）。</div>
  <div class="msg" id="msg"></div>
</div>

<!-- 單一寶箱 -->
<div class="card">
  <h2>寶箱行情 <select id="vChest" style="width:auto;min-width:200px"></select></h2>
  <div class="stats" id="stats"></div>
  <div style="margin-top:14px">
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div class="seg" id="cSide" style="flex:1;min-width:160px"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
      <div class="seg" id="cCur" style="flex:1;min-width:160px"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
    </div>
    <div id="chart"></div>
  </div>
</div>

<!-- 總覽 -->
<div class="card">
  <h2>全部寶箱總覽</h2>
  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <div class="seg" id="oSide" style="flex:1;min-width:160px"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
    <div class="seg" id="oCur" style="flex:1;min-width:160px"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
  </div>
  <div class="tablewrap"><table id="overview"></table></div>
  <div class="hint">點一列可切換到該寶箱的行情。</div>
</div>

<!-- 紀錄 -->
<div class="card">
  <h2>歷史紀錄 <select id="lChest" style="width:auto;min-width:180px"></select></h2>
  <ul class="log" id="log"></ul>
</div>

<!-- 資料 -->
<div class="card">
  <h2>資料備份</h2>
  <div class="foot">
    <button class="btn ghost small" id="expBtn">匯出 JSON</button>
    <button class="btn ghost small" id="impBtn">匯入 JSON</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn danger small" id="clrBtn">清除全部紀錄</button>
  </div>
  <div class="hint">紀錄存在這個瀏覽器裡（localStorage）。換手機、換瀏覽器或清除網站資料前，先匯出備份。</div>
</div>
</div>

<script>
// 寶箱清單：取自 Shop Titans 官方試算表 Full Moon Fusions 頁
const CHEST_GROUPS = [
  { label: "一般寶箱", items: ["Wooden Chest","Frozen Chest","Slimy Chest","Limestone Chest","Ancient Chest","Timeworn Chest","Forsaken Chest","Sunken Chest","Bleak Chest","Molten Chest","Void Chest","Divine Chest","Prehistoric Chest","Otherworldly Chest"] },
  { label: "特殊寶箱", items: ["Luxurious Chest","Opulent Chest","Platinum Chest","Pearlescent Chest"] }
];
const CHESTS = CHEST_GROUPS.flatMap(g => g.items);
const KEY = "chestMarket.v1";
const SIDE = { buy: "買入", sell: "賣出" };
const CUR = { gold: "Gold", gem: "Gem" };

let records = load();

function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(r) ? r : []; }
  catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(records)); return true; }
  catch(e){ flash("無法儲存到瀏覽器，請記得匯出備份。", true); return false; }
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function parsePrice(s){
  s = String(s).trim().toLowerCase().replace(/[,\s]/g, "");
  const m = s.match(/^(\d*\.?\d+)([kmb])?$/);
  if(!m) return NaN;
  const mul = { k:1e3, m:1e6, b:1e9 }[m[2]] || 1;
  return Math.round(parseFloat(m[1]) * mul);
}
const fmt = n => Number(n).toLocaleString("en-US");
function compact(n){
  if(n >= 1e9) return +(n/1e9).toFixed(2) + "B";
  if(n >= 1e6) return +(n/1e6).toFixed(2) + "M";
  if(n >= 1e3) return +(n/1e3).toFixed(1) + "K";
  return String(n);
}
// ts 格式：YYYY-MM-DDTHH
const showTs = ts => ts.slice(0,10) + " " + ts.slice(11,13) + ":00";
function nowTs(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}`; }
function flash(t, bad){ const m = $("msg"); m.textContent = t; m.style.color = bad ? "var(--danger)" : "var(--buy)"; clearTimeout(flash.t); flash.t = setTimeout(()=> m.textContent = "", 3500); }

function fillChestSelect(sel, withAll){
  sel.innerHTML = (withAll ? '<option value="">全部寶箱</option>' : "") +
    CHEST_GROUPS.map(g => `<optgroup label="${g.label}">` + g.items.map(c => `<option>${c}</option>`).join("") + "</optgroup>").join("");
}
function segValue(id){ return $(id).querySelector("button.on").dataset.v; }
function bindSeg(id, onChange){
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    e.preventDefault();
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    onChange && onChange(b.dataset.v);
  });
}
function setSeg(id, v){ $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === v)); }

function subset(chest, side, cur){
  return records.filter(r => r.chest === chest && r.side === side && r.cur === cur);
}
function summarize(list){
  if(!list.length) return null;
  let hi = list[0], lo = list[0], last = list[0];
  for(const r of list){
    if(r.price > hi.price || (r.price === hi.price && r.ts > hi.ts)) hi = r;
    if(r.price < lo.price || (r.price === lo.price && r.ts > lo.ts)) lo = r;
    if(r.ts > last.ts || (r.ts === last.ts && r.id > last.id)) last = r;
  }
  return { hi, lo, last, n: list.length };
}

// ---------- form ----------
function initForm(){
  fillChestSelect($("fChest"));
  $("fHour").innerHTML = Array.from({length:24}, (_,h) => `<option value="${pad(h)}">${pad(h)}:00</option>`).join("");
  setNow();
  bindSeg("fSide"); bindSeg("fCur");
  $("nowBtn").onclick = setNow;
  $("addBtn").onclick = addRecord;
  $("fPrice").addEventListener("keydown", e => { if(e.key === "Enter") addRecord(); });
  $("fChest").onchange = () => { $("vChest").value = $("fChest").value; renderView(); };
}
function setNow(){ const t = nowTs(); $("fDate").value = t.slice(0,10); $("fHour").value = t.slice(11,13); }

function addRecord(){
  const price = parsePrice($("fPrice").value);
  if(!(price > 0)){ flash("請輸入有效的價格。", true); $("fPrice").focus(); return; }
  if(!$("fDate").value){ flash("請選擇日期。", true); return; }
  const r = {
    id: Date.now() + Math.random().toString(36).slice(2,6),
    ts: $("fDate").value + "T" + $("fHour").value,
    side: segValue("fSide"), chest: $("fChest").value, cur: segValue("fCur"), price
  };
  const before = summarize(subset(r.chest, r.side, r.cur));
  records.push(r); save();
  let note = "";
  if(before){
    if(price > before.hi.price) note = "（新高！）";
    else if(price < before.lo.price) note = "（新低！）";
  }
  flash(`已記錄：${SIDE[r.side]} ${r.chest} ${fmt(price)} ${CUR[r.cur]}${note}`);
  $("fPrice").value = "";
  $("vChest").value = r.chest; setSeg("cSide", r.side); setSeg("cCur", r.cur);
  renderAll();
}

// ---------- 單一寶箱 ----------
function renderView(){
  const chest = $("vChest").value;
  $("stats").innerHTML = ["buy","sell"].flatMap(side => ["gold","gem"].map(cur => {
    const s = summarize(subset(chest, side, cur));
    const head = `<div class="t"><span class="tag ${side}">${SIDE[side]}</span><span class="tag ${cur}">${CUR[cur]}</span></div>`;
    if(!s) return `<div class="stat">${head}<div class="empty">尚無紀錄</div></div>`;
    return `<div class="stat">${head}
      <div class="kv"><span class="hi">最高</span><span><b>${fmt(s.hi.price)}</b> <span class="when">${showTs(s.hi.ts)}</span></span></div>
      <div class="kv"><span class="lo">最低</span><span><b>${fmt(s.lo.price)}</b> <span class="when">${showTs(s.lo.ts)}</span></span></div>
      <div class="kv"><span>最新</span><span><b>${fmt(s.last.price)}</b> <span class="when">${showTs(s.last.ts)}</span></span></div>
      <div class="kv"><span>筆數</span><b>${s.n}</b></div></div>`;
  })).join("");
  renderChart();
}

function renderChart(){
  const chest = $("vChest").value, side = segValue("cSide"), cur = segValue("cCur");
  const list = subset(chest, side, cur).slice().sort((a,b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : (a.id < b.id ? -1 : 1));
  const box = $("chart");
  if(list.length < 2){ box.innerHTML = `<div class="empty">${list.length ? "再多一筆紀錄就能畫出價格走勢。" : "這個組合還沒有紀錄。"}</div>`; return; }
  const W = 640, H = 220, L = 56, R = 12, T = 12, B = 30;
  const prices = list.map(r => r.price);
  let min = Math.min(...prices), max = Math.max(...prices);
  if(min === max){ min *= 0.95; max *= 1.05; }
  const x = i => L + (W - L - R) * (list.length === 1 ? 0.5 : i / (list.length - 1));
  const y = p => T + (H - T - B) * (1 - (p - min) / (max - min));
  const color = cur === "gold" ? "var(--gold)" : "var(--gem)";
  const pts = list.map((r,i) => `${x(i).toFixed(1)},${y(r.price).toFixed(1)}`).join(" ");
  const grid = [0, .5, 1].map(f => { const p = min + (max - min) * f, yy = y(p);
    return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${compact(Math.round(p))}</text>`; }).join("");
  const dots = list.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.price)}" r="3.5" fill="${color}"><title>${showTs(r.ts)}  ${fmt(r.price)}</title></circle>`).join("");
  const labels = [0, list.length - 1].map(i => `<text x="${x(i)}" y="${H-10}" text-anchor="${i ? "end" : "start"}">${showTs(list[i].ts).slice(5)}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="價格走勢">${grid}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labels}</svg>`;
}

// ---------- 總覽 ----------
function renderOverview(){
  const side = segValue("oSide"), cur = segValue("oCur");
  const rows = CHESTS.map(c => {
    const s = summarize(subset(c, side, cur));
    if(!s) return `<tr class="click" data-c="${c}"><td>${c}</td><td colspan="4" class="empty" style="text-align:right">—</td></tr>`;
    return `<tr class="click" data-c="${c}"><td>${c}</td>
      <td class="lo">${fmt(s.lo.price)}<span class="when">${showTs(s.lo.ts)}</span></td>
      <td class="hi">${fmt(s.hi.price)}<span class="when">${showTs(s.hi.ts)}</span></td>
      <td>${fmt(s.last.price)}<span class="when">${showTs(s.last.ts)}</span></td>
      <td>${s.n}</td></tr>`;
  }).join("");
  $("overview").innerHTML = `<thead><tr><th>寶箱</th><th>最低</th><th>最高</th><th>最新</th><th>筆數</th></tr></thead><tbody>${rows}</tbody>`;
}

// ---------- 紀錄 ----------
function renderLog(){
  const f = $("lChest").value;
  const list = records.filter(r => !f || r.chest === f).sort((a,b) => a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : (a.id < b.id ? 1 : -1));
  $("log").innerHTML = list.length ? list.slice(0, 300).map(r => `<li>
      <span class="when">${showTs(r.ts)}</span>
      <span class="tag ${r.side}">${SIDE[r.side]}</span>
      <span>${r.chest}</span>
      <span class="p" style="color:var(--${r.cur})">${fmt(r.price)} ${CUR[r.cur]}</span>
      <button class="x" data-id="${r.id}" title="刪除">✕</button></li>`).join("")
    : `<li class="empty">尚無紀錄</li>`;
}

function renderAll(){ renderView(); renderOverview(); renderLog(); }

// ---------- 備份 ----------
function exportJson(){
  const blob = new Blob([JSON.stringify({ app: "chest-market", version: 1, exported: new Date().toISOString(), records }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `chest_market_${nowTs().replace("T","_")}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJson(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const arr = Array.isArray(d) ? d : d.records;
      if(!Array.isArray(arr)) throw 0;
      const ok = arr.filter(r => r && r.id && CHESTS.includes(r.chest) && SIDE[r.side] && CUR[r.cur] && r.price > 0 && /^\d{4}-\d{2}-\d{2}T\d{2}$/.test(r.ts));
      const ids = new Set(records.map(r => r.id));
      const add = ok.filter(r => !ids.has(r.id));
      records = records.concat(add); save(); renderAll();
      alert(`匯入完成：新增 ${add.length} 筆，略過重複或無效 ${arr.length - add.length} 筆。`);
    }catch(e){ alert("檔案格式不正確，無法匯入。"); }
  };
  rd.readAsText(file);
}

// ---------- init ----------
initForm();
fillChestSelect($("vChest"));
fillChestSelect($("lChest"), true);
bindSeg("cSide", renderChart); bindSeg("cCur", renderChart);
bindSeg("oSide", renderOverview); bindSeg("oCur", renderOverview);
$("vChest").onchange = renderView;
$("lChest").onchange = renderLog;
$("overview").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-c]"); if(!tr) return;
  $("vChest").value = tr.dataset.c; $("fChest").value = tr.dataset.c;
  setSeg("cSide", segValue("oSide")); setSeg("cCur", segValue("oCur"));
  renderView(); $("vChest").scrollIntoView({ behavior: "smooth", block: "center" });
});
$("log").addEventListener("click", e => {
  const b = e.target.closest(".x"); if(!b) return;
  const r = records.find(x => x.id === b.dataset.id);
  if(r && confirm(`刪除這筆紀錄？\n${showTs(r.ts)} ${SIDE[r.side]} ${r.chest} ${fmt(r.price)} ${CUR[r.cur]}`)){
    records = records.filter(x => x.id !== r.id); save(); renderAll();
  }
});
$("expBtn").onclick = exportJson;
$("impBtn").onclick = () => $("impFile").click();
$("impFile").onchange = e => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value = ""; };
$("clrBtn").onclick = () => {
  if(records.length && confirm(`確定要清除全部 ${records.length} 筆紀錄？建議先匯出備份。`)){ records = []; save(); renderAll(); }
};
renderAll();
</script>
</body>
</html>
