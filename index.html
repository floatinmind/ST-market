<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市場行情簿</title>
<style>
:root{
  --bg:#17130e; --panel:#221c15; --panel2:#2b241b; --line:#4a3d2c;
  --text:#efe4cf; --muted:#a8987c; --accent:#d9a441;
  --gold:#e8b949; --gem:#5ec8e5; --buy:#6fbf73; --sell:#e07a5f; --danger:#c85a4a;
  --q-normal:#c9bfae; --q-superior:#7fd08a; --q-flawless:#5ec8e5; --q-epic:#b58cf0; --q-legendary:#f0a040;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
header h1{margin:0;font-size:22px;color:var(--accent);letter-spacing:1px}
header span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 4px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.full{grid-column:1/-1}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:15px;width:100%;font-family:inherit}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);color:var(--muted);border:0;padding:9px 4px;font-size:14px;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v=buy]{background:var(--buy);color:#10210f;font-weight:700}
.seg button.on[data-v=sell]{background:var(--sell);color:#2a0f08;font-weight:700}
.seg button.on[data-v=gold]{background:var(--gold);color:#2a1e05;font-weight:700}
.seg button.on[data-v=gem]{background:var(--gem);color:#06222b;font-weight:700}
.seg.q button{font-size:12px;padding:9px 2px}
.seg.q button.on{color:#1a1510;font-weight:700}
.seg.q button.on[data-v=normal]{background:var(--q-normal)}
.seg.q button.on[data-v=superior]{background:var(--q-superior)}
.seg.q button.on[data-v=flawless]{background:var(--q-flawless)}
.seg.q button.on[data-v=epic]{background:var(--q-epic)}
.seg.q button.on[data-v=legendary]{background:var(--q-legendary)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{background:var(--accent);color:#2a1e05;border:0;border-radius:7px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .t{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.tag.buy{background:var(--buy);color:#10210f}.tag.sell{background:var(--sell);color:#2a0f08}
.tag.gold{background:var(--gold);color:#2a1e05}.tag.gem{background:var(--gem);color:#06222b}
.tag.q-normal{background:var(--q-normal);color:#1a1510}.tag.q-superior{background:var(--q-superior);color:#1a1510}
.tag.q-flawless{background:var(--q-flawless);color:#1a1510}.tag.q-epic{background:var(--q-epic);color:#1a1510}
.tag.q-legendary{background:var(--q-legendary);color:#1a1510}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.kv b{font-variant-numeric:tabular-nums}
.kv .when{color:var(--muted);font-size:12px}
.hi{color:#f08c6c}.lo{color:#7fd08a}
.empty{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td .when{display:block;color:var(--muted);font-size:11px}
td .sub{display:block;color:var(--muted);font-size:11px}
.tablewrap{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.log .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.log .when{color:var(--muted);font-size:12px;min-width:112px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.x:hover{color:var(--danger)}
.star{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 10px;line-height:1;flex:0 0 auto}
.star.on{color:var(--gold);border-color:var(--gold)}
svg text{fill:var(--muted);font-size:11px}
#chart .hit{cursor:pointer}
.cinfo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:6px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:13px;font-variant-numeric:tabular-nums}
.cinfo b{font-size:15px}.cinfo .when{color:var(--muted);font-size:12px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.picker{position:relative}
.pklist{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow-y:auto;z-index:20;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pklist.open{display:block}
.pklist div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--text)}
.pklist div:hover,.pklist div.act{background:var(--line)}
.pklist small{color:var(--muted);white-space:nowrap}
.pklist .none{color:var(--muted);cursor:default}
.selname{font-size:15px;color:var(--text);font-weight:700}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>市場行情簿</h1>
  <span>Shop Titans Market Ledger</span>
</header>

<nav class="tabs" id="tabs">
  <button data-t="chest" class="on">寶箱</button>
  <button data-t="ench">元素・靈魂</button>
  <button data-t="equip">裝備</button>
</nav>

<!-- 新增紀錄 -->
<div class="card">
  <h2>新增紀錄</h2>
  <div class="grid">
    <!-- 物品選擇：依分頁切換 -->
    <div class="f full" data-for="chest">寶箱種類<select id="selChest"></select></div>
    <div class="f full hide" data-for="ench">元素／靈魂
      <div class="row"><select id="selEnch"></select><button class="star" id="starEnch" title="加入關注">☆</button></div>
    </div>
    <div class="f full hide" data-for="equip">裝備（輸入名稱搜尋）
      <div class="row">
        <div class="picker" style="flex:1">
          <input id="pk" placeholder="例：platinum、sword…" autocomplete="off">
          <div class="pklist" id="pkList"></div>
        </div>
        <button class="star" id="starEquip" title="加入關注">☆</button>
      </div>
      <div class="row" style="margin-top:6px">
        <select id="fType"><option value="">全部類型</option></select>
        <select id="fTier"><option value="">全部階級</option></select>
      </div>
    </div>
    <div class="f full hide" id="qWrap">品質
      <div class="seg q" id="fQ">
        <button data-v="normal" class="on">Normal</button><button data-v="superior">Superior</button><button data-v="flawless">Flawless</button><button data-v="epic">Epic</button><button data-v="legendary">Legendary</button>
      </div>
    </div>
    <div class="f">交易方向
      <div class="seg" id="fSide"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
    </div>
    <div class="f">幣別
      <div class="seg" id="fCur"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
    </div>
    <div class="f">價格
      <div class="row"><input id="fPrice" inputmode="decimal" placeholder="例：1.25" style="flex:2"><select id="fUnit" style="flex:1">
        <option value="1">—</option><option value="1e3">k</option><option value="1e6" selected>m</option><option value="1e9">g</option><option value="1e12">T</option>
      </select></div>
    </div>
    <div class="f">日期與時間（小時）
      <div class="row"><input type="date" id="fDate"><select id="fHour"></select></div>
    </div>
  </div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap">
    <button class="btn" id="addBtn" style="flex:0 0 auto">記錄</button>
    <button class="btn ghost small" id="nowBtn" style="flex:0 0 auto">時間設為現在</button>
  </div>
  <div class="hint" id="unitHint">輸入數字後在右邊選單位：k = 千、m = 百萬、g = 十億、T = 兆（例如 1.25 + m = 1,250,000）。選「—」代表不加單位。</div>
  <div class="msg" id="msg"></div>
</div>

<!-- 行情 -->
<div class="card">
  <h2><span id="vTitle">行情</span></h2>
  <div id="vBody">
    <div class="stats" id="stats"></div>
    <div style="margin-top:14px">
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div class="seg" id="cSide" style="flex:1;min-width:150px"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
        <div class="seg" id="cCur" style="flex:1;min-width:150px"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
      </div>
      <div id="chart"></div>
    </div>
  </div>
</div>

<!-- 總覽 -->
<div class="card">
  <h2 id="oTitle">總覽</h2>
  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <div class="seg" id="oSide" style="flex:1;min-width:150px"><button data-v="buy" class="on">買入</button><button data-v="sell">賣出</button></div>
    <div class="seg" id="oCur" style="flex:1;min-width:150px"><button data-v="gold" class="on">Gold</button><button data-v="gem">Gem</button></div>
  </div>
  <label class="chk hide" id="oStarWrap" style="margin-bottom:8px"><input type="checkbox" id="oStar"> 只看關注</label>
  <div class="tablewrap"><table id="overview"></table></div>
  <div class="hint" id="oHint"></div>
</div>

<!-- 紀錄 -->
<div class="card">
  <h2>歷史紀錄
    <select id="lFilter" style="width:auto;min-width:160px"><option value="all">這個分頁全部</option><option value="sel">只看目前選擇</option></select>
  </h2>
  <ul class="log" id="log"></ul>
</div>

<!-- 資料 -->
<div class="card">
  <h2>資料備份</h2>
  <div class="foot">
    <button class="btn ghost small" id="expBtn">匯出 JSON</button>
    <button class="btn ghost small" id="impBtn">匯入 JSON</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn danger small" id="clrBtn">清除全部紀錄</button>
  </div>
  <div class="hint">三個分頁的紀錄和關注清單都存在這個瀏覽器裡（localStorage），備份會一次匯出全部。換手機、換瀏覽器或清除網站資料前，先匯出備份。</div>
</div>
</div>

// ---------- storage ----------
function readJSON(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ flash("無法儲存到瀏覽器，請記得匯出備份。", true); return false; } }
// 舊版只有寶箱紀錄（欄位 chest），轉成新格式
function normalize(r){
  if(!r) return null;
  if(!r.cat && r.chest){ r = { ...r, cat:"chest", item:r.chest }; delete r.chest; }
  if(r.cat === "chest") r.q = null;
  return r;
}
let records = (readJSON(KEY, []) || []).map(normalize).filter(Boolean);
let stars = readJSON(STAR_KEY, { ench:[], equip:[] });
const save = () => writeJSON(KEY, records);
const saveStars = () => writeJSON(STAR_KEY, stars);

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const UNITS = { k:1e3, m:1e6, g:1e9, b:1e9, t:1e12 };
function parsePrice(s, unit){
  s = String(s).trim().toLowerCase().replace(/[,\s]/g, "");
  const m = s.match(/^(\d*\.?\d+)([kmgbt])?$/);
  if(!m) return NaN;
  const mul = m[2] ? UNITS[m[2]] : (unit || 1);
  return Math.round(parseFloat(m[1]) * mul);
}
const fmt = n => Number(n).toLocaleString("en-US");
function compact(n){
  if(n >= 1e12) return +(n/1e12).toFixed(2) + "T";
  if(n >= 1e9) return +(n/1e9).toFixed(2) + "g";
  if(n >= 1e6) return +(n/1e6).toFixed(2) + "m";
  if(n >= 1e3) return +(n/1e3).toFixed(1) + "k";
  return String(n);
}
const showTs = ts => ts.slice(0,10) + " " + ts.slice(11,13) + ":00";
function nowTs(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}`; }
function flash(t, bad){ const m = $("msg"); m.textContent = t; m.style.color = bad ? "var(--danger)" : "var(--buy)"; clearTimeout(flash.t); flash.t = setTimeout(() => m.textContent = "", 3500); }
function segValue(id){ return $(id).querySelector("button.on").dataset.v; }
function bindSeg(id, onChange){
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    e.preventDefault();
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    onChange && onChange(b.dataset.v);
  });
}
function setSeg(id, v){ $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === v)); }
const qTag = q => q ? `<span class="tag q-${q}">${QUAL[q]}</span>` : "";
const byTsDesc = (a,b) => a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : (a.id < b.id ? 1 : -1);
const byTsAsc = (a,b) => -byTsDesc(a,b);

// ---------- state ----------
let tab = "chest";
const sel = {
  chest: { item: CHESTS[0], q: null },
  ench:  { item: ENCH[0][0], q: "normal" },
  equip: { item: null, q: "normal" }
};
const cur = () => sel[tab];
const isStar = (t, item) => (stars[t] || []).includes(item);

function subset(t, item, q, side, c){
  return records.filter(r => r.cat === t && r.item === item && (r.q || null) === (q || null) && r.side === side && r.cur === c);
}
function summarize(list){
  if(!list.length) return null;
  let hi = list[0], lo = list[0], last = list[0];
  for(const r of list){
    if(r.price > hi.price || (r.price === hi.price && r.ts > hi.ts)) hi = r;
    if(r.price < lo.price || (r.price === lo.price && r.ts > lo.ts)) lo = r;
    if(byTsDesc(r, last) < 0) last = r;
  }
  return { hi, lo, last, n: list.length };
}

// ---------- 分頁 ----------
function setTab(t){
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll("[data-for]").forEach(el => el.classList.toggle("hide", el.dataset.for !== t));
  $("qWrap").classList.toggle("hide", t === "chest");
  $("oStarWrap").classList.toggle("hide", t === "chest");
  if(t !== "chest") setSeg("fQ", cur().q);
  writeJSON(PREF_KEY, { tab: t });
  syncItemUI(); renderAll();
}

// ---------- 物品選擇 ----------
function initSelectors(){
  $("selChest").innerHTML = CHEST_GROUPS.map(g => `<optgroup label="${g.label}">` + g.items.map(c => `<option>${c}</option>`).join("") + "</optgroup>").join("");
  $("selChest").onchange = () => { sel.chest.item = $("selChest").value; renderAll(); };

  const grp = k => ENCH.filter(e => e[1] === k).map(([n,,t]) => `<option value="${esc(n)}">T${t}　${esc(n)}</option>`).join("");
  $("selEnch").innerHTML = `<optgroup label="元素 Element">${grp("Element")}</optgroup><optgroup label="靈魂 Spirit">${grp("Spirit")}</optgroup>`;
  $("selEnch").onchange = () => { sel.ench.item = $("selEnch").value; syncItemUI(); renderAll(); };

  const types = [...new Set(EQUIP.map(e => e[1]))];
  $("fType").innerHTML += types.map(t => `<option>${esc(t)}</option>`).join("");
  const tiers = [...new Set(EQUIP.map(e => e[2]))].sort((a,b) => a-b);
  $("fTier").innerHTML += tiers.map(t => `<option value="${t}">T${t}</option>`).join("");
  $("fType").onchange = $("fTier").onchange = () => { renderOverview(); if(document.activeElement === $("pk")) openPicker(); };

  $("starEnch").onclick = () => toggleStar("ench");
  $("starEquip").onclick = () => toggleStar("equip");
  bindSeg("fQ", v => { cur().q = v; renderAll(); });
  initPicker();
}
function syncItemUI(){
  if(tab === "chest") $("selChest").value = sel.chest.item;
  if(tab === "ench") $("selEnch").value = sel.ench.item;
  if(tab === "equip") $("pk").value = sel.equip.item || "";
  ["ench","equip"].forEach(t => {
    const b = $(t === "ench" ? "starEnch" : "starEquip"), on = sel[t].item && isStar(t, sel[t].item);
    b.classList.toggle("on", !!on); b.textContent = on ? "★" : "☆";
  });
}
function toggleStar(t){
  const item = sel[t].item; if(!item){ flash("請先選擇物品。", true); return; }
  const list = stars[t] || (stars[t] = []);
  const i = list.indexOf(item);
  if(i >= 0) list.splice(i, 1); else list.push(item);
  saveStars(); syncItemUI(); renderOverview();
}
function selectItem(t, item, q){
  sel[t].item = item;
  if(q && t !== "chest"){ sel[t].q = q; setSeg("fQ", q); }
  syncItemUI(); renderAll();
}

// 裝備搜尋
let pkIdx = -1, pkItems = [];
function equipMatches(query){
  const type = $("fType").value, tier = $("fTier").value;
  const toks = query.toLowerCase().split(/\s+/).filter(Boolean);
  let list = EQUIP.filter(([n,ty,t]) => (!type || ty === type) && (!tier || t == tier) && toks.every(k => n.toLowerCase().includes(k)));
  if(!toks.length && !type && !tier){
    // 沒輸入時：先列關注，再列最近記錄過的
    const recent = [...new Set(records.filter(r => r.cat === "equip").sort(byTsDesc).map(r => r.item))];
    const order = [...new Set([...(stars.equip || []), ...recent])];
    list = order.map(n => EQUIP.find(e => e[0] === n)).filter(Boolean);
  }
  return list.slice(0, 60);
}
function openPicker(){
  pkItems = equipMatches($("pk").value);
  pkIdx = -1;
  const empty = !$("pk").value.trim() && !$("fType").value && !$("fTier").value;
  $("pkList").innerHTML = pkItems.length
    ? pkItems.map(([n,ty,t], i) => `<div data-i="${i}"><span>${isStar("equip", n) ? "★ " : ""}${esc(n)}</span><small>${esc(ty)} · T${t}</small></div>`).join("")
    : `<div class="none">${empty ? "輸入名稱開始搜尋，或用下方類型／階級篩選。" : "找不到符合的裝備。"}</div>`;
  $("pkList").classList.add("open");
}
function closePicker(){ $("pkList").classList.remove("open"); }
function pickAt(i){
  const it = pkItems[i]; if(!it) return;
  closePicker(); $("pk").blur(); selectItem("equip", it[0]);
}
function initPicker(){
  $("pk").addEventListener("focus", () => { $("pk").select(); openPicker(); });
  $("pk").addEventListener("input", openPicker);
  $("pk").addEventListener("keydown", e => {
    const rows = $("pkList").querySelectorAll("div[data-i]");
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); if(!rows.length) return;
      pkIdx = (pkIdx + (e.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length;
      rows.forEach((r,i) => r.classList.toggle("act", i === pkIdx));
      rows[pkIdx].scrollIntoView({ block:"nearest" });
    } else if(e.key === "Enter"){ e.preventDefault(); pickAt(pkIdx >= 0 ? pkIdx : 0); }
    else if(e.key === "Escape"){ closePicker(); $("pk").blur(); }
  });
  $("pk").addEventListener("blur", () => setTimeout(() => { closePicker(); $("pk").value = sel.equip.item || ""; }, 150));
  $("pkList").addEventListener("mousedown", e => e.preventDefault());
  $("pkList").addEventListener("click", e => { const d = e.target.closest("div[data-i]"); if(d) pickAt(+d.dataset.i); });
}

// ---------- form ----------
function initForm(){
  $("fHour").innerHTML = Array.from({length:24}, (_,h) => `<option value="${pad(h)}">${pad(h)}:00</option>`).join("");
  setNow();
  bindSeg("fSide"); bindSeg("fCur", updateUnit); updateUnit();
  $("nowBtn").onclick = setNow;
  $("addBtn").onclick = addRecord;
  $("fPrice").addEventListener("keydown", e => { if(e.key === "Enter") addRecord(); });
}
function setNow(){ const t = nowTs(); $("fDate").value = t.slice(0,10); $("fHour").value = t.slice(11,13); }
// Gem 價格不超過 1000，不需要單位
function updateUnit(){
  const gem = segValue("fCur") === "gem";
  $("fUnit").style.display = gem ? "none" : "";
  $("fPrice").placeholder = gem ? "例：150" : "例：1.25";
  $("fPrice").inputMode = gem ? "numeric" : "decimal";
  $("unitHint").style.display = gem ? "none" : "";
}
function addRecord(){
  const s = cur();
  if(!s.item){ flash("請先選擇裝備。", true); $("pk").focus(); return; }
  const isGem = segValue("fCur") === "gem";
  const price = parsePrice($("fPrice").value, isGem ? 1 : Number($("fUnit").value));
  if(!(price > 0)){ flash("請輸入有效的價格。", true); $("fPrice").focus(); return; }
  if(!$("fDate").value){ flash("請選擇日期。", true); return; }
  const r = {
    id: Date.now() + Math.random().toString(36).slice(2,6),
    ts: $("fDate").value + "T" + $("fHour").value,
    cat: tab, item: s.item, q: tab === "chest" ? null : s.q,
    side: segValue("fSide"), cur: segValue("fCur"), price
  };
  const before = summarize(subset(r.cat, r.item, r.q, r.side, r.cur));
  records.push(r); save();
  let note = "";
  if(before){
    if(price > before.hi.price) note = "（新高！）";
    else if(price < before.lo.price) note = "（新低！）";
  }
  flash(`已記錄：${SIDE[r.side]} ${r.item}${r.q ? " " + QUAL[r.q] : ""} ${fmt(price)} ${CUR[r.cur]}${note}`);
  $("fPrice").value = "";
  setSeg("cSide", r.side); setSeg("cCur", r.cur); setSeg("oSide", r.side); setSeg("oCur", r.cur);
  renderAll();
}

// ---------- 行情 ----------
function renderView(){
  const s = cur();
  if(!s.item){
    $("vTitle").innerHTML = "行情";
    $("vBody").innerHTML = `<div class="empty">在上方搜尋並選擇一件裝備，就會顯示它的最高、最低價格。</div>`;
    return;
  }
  if(!$("stats")) restoreViewBody();
  const info = INFO[s.item];
  $("vTitle").innerHTML = `<span class="selname">${esc(s.item)}</span> ${qTag(s.q)}${info ? ` <small style="color:var(--muted);font-weight:400">${esc(info.type)} · T${info.tier}</small>` : ""}`;
  $("stats").innerHTML = ["buy","sell"].flatMap(side => ["gold","gem"].map(c => {
    const st = summarize(subset(tab, s.item, s.q, side, c));
    const head = `<div class="t"><span class="tag ${side}">${SIDE[side]}</span><span class="tag ${c}">${CUR[c]}</span></div>`;
    if(!st) return `<div class="stat">${head}<div class="empty">尚無紀錄</div></div>`;
    return `<div class="stat">${head}
      <div class="kv"><span class="hi">最高</span><span><b>${fmt(st.hi.price)}</b> <span class="when">${showTs(st.hi.ts)}</span></span></div>
      <div class="kv"><span class="lo">最低</span><span><b>${fmt(st.lo.price)}</b> <span class="when">${showTs(st.lo.ts)}</span></span></div>
      <div class="kv"><span>最新</span><span><b>${fmt(st.last.price)}</b> <span class="when">${showTs(st.last.ts)}</span></span></div>
      <div class="kv"><span>筆數</span><b>${st.n}</b></div></div>`;
  })).join("");
  renderChart();
}
let viewBodyHTML;
function restoreViewBody(){ $("vBody").innerHTML = viewBodyHTML; bindSeg("cSide", renderChart); bindSeg("cCur", renderChart); }

function renderChart(){
  const s = cur(); if(!s.item || !$("chart")) return;
  const c = segValue("cCur");
  const list = subset(tab, s.item, s.q, segValue("cSide"), c).sort(byTsAsc);
  const box = $("chart");
  if(list.length < 2){ box.innerHTML = `<div class="empty">${list.length ? "再多一筆紀錄就能畫出價格走勢。" : "這個組合還沒有紀錄。"}</div>`; return; }
  const W = 640, H = 220, L = 56, R = 12, T = 12, B = 30;
  const prices = list.map(r => r.price);
  let min = Math.min(...prices), max = Math.max(...prices);
  if(min === max){ min *= 0.95; max *= 1.05; }
  const x = i => L + (W - L - R) * (i / (list.length - 1));
  const y = p => T + (H - T - B) * (1 - (p - min) / (max - min));
  const color = c === "gold" ? "var(--gold)" : "var(--gem)";
  const pts = list.map((r,i) => `${x(i).toFixed(1)},${y(r.price).toFixed(1)}`).join(" ");
  const grid = [0, .5, 1].map(f => { const p = min + (max - min) * f, yy = y(p);
    return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${compact(Math.round(p))}</text>`; }).join("");
  const dots = list.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.price)}" r="3.5" fill="${color}"/>`).join("");
  // 透明的大圓當作點擊範圍，手機上比較好點
  const hits = list.map((r,i) => `<circle class="hit" data-i="${i}" cx="${x(i)}" cy="${y(r.price)}" r="14" fill="transparent"/>`).join("");
  const labels = [0, list.length - 1].map(i => `<text x="${x(i)}" y="${H-10}" text-anchor="${i ? "end" : "start"}">${showTs(list[i].ts).slice(5)}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="價格走勢">${grid}
    <line id="cGuide" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}
    <circle id="cMark" r="6.5" fill="${color}" stroke="var(--text)" stroke-width="2" visibility="hidden"/>${labels}${hits}</svg>
    <div class="cinfo" id="cInfo"><span class="empty">點選圖上的點，可查看當時的價格與時間。</span></div>`;
  chartState = { list, x, y, c };
  // 切換物品或幣別後，預設選最新一筆
  selectPoint(list.length - 1);
}
let chartState = null;
function selectPoint(i){
  const st = chartState; if(!st || !$("cInfo")) return;
  const r = st.list[i]; if(!r) return;
  const cx = st.x(i), cy = st.y(r.price);
  $("cMark").setAttribute("cx", cx); $("cMark").setAttribute("cy", cy); $("cMark").setAttribute("visibility", "visible");
  $("cGuide").setAttribute("x1", cx); $("cGuide").setAttribute("x2", cx); $("cGuide").setAttribute("visibility", "visible");
  const prev = st.list[i - 1];
  let diff = "";
  if(prev){
    const d = r.price - prev.price, pct = prev.price ? d / prev.price * 100 : 0;
    const cls = d > 0 ? "hi" : d < 0 ? "lo" : "";
    diff = `<span class="${cls}">比上一筆 ${d > 0 ? "+" : ""}${fmt(d)}（${d > 0 ? "+" : ""}${pct.toFixed(1)}%）</span>`;
  }
  $("cInfo").innerHTML = `<span class="when">${showTs(r.ts)}</span>
    <b style="color:var(--${st.c})">${fmt(r.price)} ${CUR[st.c]}</b>${st.c === "gold" && r.price >= 1000 ? `<span class="when">（${compact(r.price)}）</span>` : ""}
    ${diff}<span class="when" style="margin-left:auto">第 ${i + 1} / ${st.list.length} 筆</span>`;
}

// ---------- 總覽 ----------
function renderOverview(){
  const side = segValue("oSide"), c = segValue("oCur");
  $("oTitle").textContent = TAB_NAME[tab] + "總覽";
  let rows = [];
  if(tab === "chest"){
    rows = CHESTS.map(item => ({ item, q:null }));
    $("oHint").textContent = "點一列可切換到該寶箱的行情。";
  } else {
    // 只列有紀錄的物品＋品質組合；關注但還沒紀錄的也列出
    const seen = new Map();
    records.filter(r => r.cat === tab).forEach(r => seen.set(r.item + "|" + r.q, { item:r.item, q:r.q }));
    rows = [...seen.values()];
    (stars[tab] || []).forEach(item => { if(!rows.some(x => x.item === item)) rows.push({ item, q:null, placeholder:true }); });
    if(tab === "equip"){
      const type = $("fType").value, tier = $("fTier").value;
      rows = rows.filter(x => { const i = INFO[x.item] || {}; return (!type || i.type === type) && (!tier || i.tier == tier); });
    }
    if($("oStar").checked) rows = rows.filter(x => isStar(tab, x.item));
    $("oHint").textContent = "只列出記錄過或加了關注（★）的項目" + (tab === "equip" ? "，並套用上方的類型／階級篩選" : "") + "。點一列可切換過去。";
  }
  const data = rows.map(x => ({ ...x, s: x.placeholder ? null : summarize(subset(tab, x.item, x.q, side, c)) }));
  if(tab !== "chest"){
    const lastAny = x => records.filter(r => r.cat === tab && r.item === x.item && (r.q || null) === (x.q || null)).reduce((m,r) => r.ts > m ? r.ts : m, "");
    data.forEach(x => x.lt = lastAny(x));
    data.sort((a,b) => (isStar(tab,b.item) - isStar(tab,a.item)) || (a.lt < b.lt ? 1 : a.lt > b.lt ? -1 : 0));
  }
  if(!data.length){ $("overview").innerHTML = `<tbody><tr><td class="empty">還沒有紀錄。</td></tr></tbody>`; return; }
  const body = data.map(x => {
    const info = INFO[x.item];
    const name = `${isStar(tab, x.item) ? "★ " : ""}${esc(x.item)} ${qTag(x.q)}` + (tab !== "chest" && info ? `<span class="sub">${esc(info.type)} · T${info.tier}</span>` : "");
    const attrs = `class="click" data-i="${esc(x.item)}" data-q="${x.q || ""}"`;
    if(!x.s) return `<tr ${attrs}><td>${name}</td><td colspan="4" class="empty">—</td></tr>`;
    return `<tr ${attrs}><td>${name}</td>
      <td class="lo">${fmt(x.s.lo.price)}<span class="when">${showTs(x.s.lo.ts)}</span></td>
      <td class="hi">${fmt(x.s.hi.price)}<span class="when">${showTs(x.s.hi.ts)}</span></td>
      <td>${fmt(x.s.last.price)}<span class="when">${showTs(x.s.last.ts)}</span></td>
      <td>${x.s.n}</td></tr>`;
  }).join("");
  $("overview").innerHTML = `<thead><tr><th>${tab === "chest" ? "寶箱" : "物品"}</th><th>最低</th><th>最高</th><th>最新</th><th>筆數</th></tr></thead><tbody>${body}</tbody>`;
}

// ---------- 紀錄 ----------
function renderLog(){
  const s = cur(), only = $("lFilter").value === "sel";
  const list = records.filter(r => r.cat === tab && (!only || (r.item === s.item && (r.q || null) === (s.q || null)))).sort(byTsDesc);
  $("log").innerHTML = list.length ? list.slice(0, 300).map(r => `<li>
      <span class="when">${showTs(r.ts)}</span>
      <span class="tag ${r.side}">${SIDE[r.side]}</span>
      <span>${esc(r.item)}</span>${qTag(r.q)}
      <span class="p" style="color:var(--${r.cur})">${fmt(r.price)} ${CUR[r.cur]}</span>
      <button class="x" data-id="${r.id}" title="刪除">✕</button></li>`).join("")
    : `<li class="empty">尚無紀錄</li>`;
}

function renderAll(){ renderView(); renderOverview(); renderLog(); }

// ---------- 備份 ----------
function exportJson(){
  const blob = new Blob([JSON.stringify({ app:"chest-market", version:2, exported:new Date().toISOString(), records, stars }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `market_ledger_${nowTs().replace("T","_")}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function validRecord(r){
  return r && r.id && ITEMSET[r.cat] && ITEMSET[r.cat].has(r.item) && (r.cat === "chest" ? r.q === null : !!QUAL[r.q])
    && SIDE[r.side] && CUR[r.cur] && r.price > 0 && /^\d{4}-\d{2}-\d{2}T\d{2}$/.test(r.ts);
}
function importJson(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const arr = Array.isArray(d) ? d : d.records;
      if(!Array.isArray(arr)) throw 0;
      const ok = arr.map(normalize).filter(validRecord);
      const ids = new Set(records.map(r => r.id));
      const add = ok.filter(r => !ids.has(r.id));
      records = records.concat(add); save();
      if(d.stars) ["ench","equip"].forEach(t => { stars[t] = [...new Set([...(stars[t] || []), ...(d.stars[t] || []).filter(n => ITEMSET[t].has(n))])]; });
      saveStars(); syncItemUI(); renderAll();
      alert(`匯入完成：新增 ${add.length} 筆，略過重複或無效 ${arr.length - add.length} 筆。`);
    }catch(e){ alert("檔案格式不正確，無法匯入。"); }
  };
  rd.readAsText(file);
}

// ---------- init ----------
viewBodyHTML = $("vBody").innerHTML;
initSelectors();
initForm();
bindSeg("cSide", renderChart); bindSeg("cCur", renderChart);
bindSeg("oSide", renderOverview); bindSeg("oCur", renderOverview);
$("oStar").onchange = renderOverview;
document.addEventListener("click", e => { const h = e.target.closest && e.target.closest("#chart .hit"); if(h) selectPoint(+h.dataset.i); });
$("lFilter").onchange = renderLog;
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if(b) setTab(b.dataset.t); });
$("overview").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]"); if(!tr) return;
  setSeg("cSide", segValue("oSide")); setSeg("cCur", segValue("oCur"));
  selectItem(tab, tr.dataset.i, tr.dataset.q || null);
  $("vTitle").scrollIntoView({ behavior:"smooth", block:"start" });
});
$("log").addEventListener("click", e => {
  const b = e.target.closest(".x"); if(!b) return;
  const r = records.find(x => x.id === b.dataset.id);
  if(r && confirm(`刪除這筆紀錄？\n${showTs(r.ts)} ${SIDE[r.side]} ${r.item}${r.q ? " " + QUAL[r.q] : ""} ${fmt(r.price)} ${CUR[r.cur]}`)){
    records = records.filter(x => x.id !== r.id); save(); renderAll();
  }
});
$("expBtn").onclick = exportJson;
$("impBtn").onclick = () => $("impFile").click();
$("impFile").onchange = e => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value = ""; };
$("clrBtn").onclick = () => {
  if(records.length && confirm(`確定要清除全部 ${records.length} 筆紀錄（三個分頁）？建議先匯出備份。`)){ records = []; save(); renderAll(); }
};
save(); // 寫回轉換後的舊紀錄
setTab((readJSON(PREF_KEY, {}) || {}).tab in TAB_NAME ? readJSON(PREF_KEY, {}).tab : "chest");
</script>
